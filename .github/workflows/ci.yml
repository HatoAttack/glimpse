# 検証: すべての PR と main への push で、Release ビルドと既存テストを走らせる。
# main のルールセットでジョブ名「build-and-test」を必須のチェックに指定するので、ジョブ名は変えない（変えると PR がチェック待ちのままになる）。
# 失敗したら Actions のログを見る。テストは NG の行が失敗した項目。手元での再現は docs/development.md の「PR の検証」を参照。
# リリースの exe 作成・添付は release.yml の役目で、こちらは読み取り権限だけで動かす
name: 検証

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に続けて push したら古い実行を止める。
# main への push は実行ごとに別のグループにして、全部走らせる（同じグループだと、待機中の実行は新しい実行に置き換えられて消える）
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: ビルド
        run: dotnet build ImageViewer.sln -c Release

      - name: テスト
        run: dotnet run --project tests/ImageViewer.Tests -c Release --no-build
