<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F5B66" />
      <stop offset="100%" stop-color="#353D45" />
    </linearGradient>

    <!-- 虹（スペクトル）グラデーション -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="16.6%" stop-color="#FF9500" />
      <stop offset="33.3%" stop-color="#FFCC00" />
      <stop offset="50%" stop-color="#34C759" />
      <stop offset="66.6%" stop-color="#007AFF" />
      <stop offset="83.3%" stop-color="#5856D6" />
      <stop offset="100%" stop-color="#AF52DE" />
    </linearGradient>

    <!-- 入力光のグラデーション -->
    <linearGradient id="lightRayGrad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="216" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- 角丸マスク (App Icon Standard) -->
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- アイコン本体（マスク適用） -->
  <g clip-path="url(#iconClip)">
    <!-- ベース背景 -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />

    <!-- 入力光 (左からプリズムへの直線) -->
    <line x1="60" y1="285" x2="216" y2="285" stroke="url(#lightRayGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- 拡散する虹（スペクトル光線） -->
    <polygon points="296,285 452,240 452,330" fill="url(#rainbowGrad)" opacity="0.95" />

    <!-- プリズム（三角形） Outline -->
    <polygon points="256,150 160,336 352,336" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />

    <!-- ビューワーのフォーカスフレーム（四隅の枠） -->
    <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
      <!-- 左上 -->
      <path d="M 120 165 L 120 120 L 165 120" />
      <!-- 右上 -->
      <path d="M 347 120 L 392 120 L 392 165" />
      <!-- 左下 -->
      <path d="M 120 347 L 120 392 L 165 392" />
      <!-- 右下 -->
      <path d="M 347 392 L 392 392 L 392 347" />
    </g>
  </g>
</svg>